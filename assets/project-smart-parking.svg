<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="parkingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Background Road & Environment -->
  <rect width="600" height="340" fill="url(#parkingBg)"/>
  
  <!-- Parking Bay Floor -->
  <polygon points="60,300 540,300 480,180 120,180" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <!-- Parking Slot Grid Lines (Green/Cyan glowing IoT bay) -->
  <g stroke="#10B981" stroke-width="3" stroke-dasharray="10 6" opacity="0.8">
    <line x1="140" y1="290" x2="180" y2="190"/>
    <line x1="460" y1="290" x2="420" y2="190"/>
    <line x1="150" y1="290" x2="450" y2="290"/>
    <line x1="185" y1="190" x2="415" y2="190"/>
  </g>

  <!-- Modern Car Side / 3/4 Profile Silhouette -->
  <!-- Car Shadow -->
  <ellipse cx="300" cy="255" rx="160" ry="18" fill="#000000" opacity="0.6"/>

  <!-- Car Body Base -->
  <path d="M 160 230 C 160 210 185 200 230 195 L 270 160 C 290 145 350 145 380 160 L 420 195 C 445 200 460 210 460 230 L 450 248 C 450 252 445 254 440 254 L 175 254 C 165 254 160 248 160 230 Z" 
        fill="url(#carGrad)"/>

  <!-- Car Roof & Windows -->
  <path d="M 275 165 L 245 195 L 320 195 L 320 162 Z" fill="#0F172A"/>
  <path d="M 330 162 L 330 195 L 410 195 L 375 165 Z" fill="#0F172A"/>

  <!-- Car Wheels -->
  <!-- Front Wheel -->
  <circle cx="225" cy="248" r="22" fill="#0F172A"/>
  <circle cx="225" cy="248" r="14" fill="#64748B"/>
  <circle cx="225" cy="248" r="7" fill="#CBD5E1"/>

  <!-- Rear Wheel -->
  <circle cx="395" cy="248" r="22" fill="#0F172A"/>
  <circle cx="395" cy="248" r="14" fill="#64748B"/>
  <circle cx="395" cy="248" r="7" fill="#CBD5E1"/>

  <!-- IoT Ultrasonic Sensor & Radio Waves -->
  <circle cx="300" cy="115" r="8" fill="#2563EB"/>
  <circle cx="300" cy="115" r="4" fill="#38BDF8"/>
  
  <!-- Radio Waves -->
  <path d="M 270 100 C 285 85, 315 85, 330 100" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
  <path d="M 255 90 C 280 65, 320 65, 345 90" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" fill="none"/>
  <line x1="300" y1="123" x2="300" y2="155" stroke="#10B981" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Sensor Detection Badge -->
  <rect x="250" y="275" width="100" height="22" rx="11" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
  <circle cx="265" cy="286" r="4" fill="#10B981"/>
  <text x="276" y="290" fill="#10B981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">BAY OCCUPIED</text>

  <!-- Tag overlay -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155"/>
  <text x="32" y="38" fill="#10B981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">IOT &amp; SMART SENSORS</text>
</svg>
