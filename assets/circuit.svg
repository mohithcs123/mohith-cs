<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <!-- Glowing circuit traces -->
  <g stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Trace 1 -->
    <path d="M 10 30 L 70 30 L 95 55 L 170 55 L 185 40 L 225 40" />
    <circle cx="225" cy="40" r="4" fill="#38BDF8" stroke="#1D4ED8" stroke-width="2" />
    <circle cx="10" cy="30" r="3" fill="#2563EB" />

    <!-- Trace 2 -->
    <path d="M 40 70 L 110 70 L 130 90 L 210 90" />
    <circle cx="210" cy="90" r="4" fill="#38BDF8" stroke="#1D4ED8" stroke-width="2" />
    <circle cx="40" cy="70" r="3" fill="#2563EB" />

    <!-- Trace 3 -->
    <path d="M 20 110 L 90 110 L 105 125 L 180 125 L 195 110 L 235 110" />
    <circle cx="235" cy="110" r="4" fill="#38BDF8" stroke="#1D4ED8" stroke-width="2" />
    <circle cx="20" cy="110" r="3" fill="#2563EB" />

    <!-- Trace 4 branch -->
    <path d="M 140 55 L 155 70 L 175 70" />
    <circle cx="175" cy="70" r="3.5" fill="#60A5FA" />
  </g>
</svg>

