<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#portBg)"/>

  <!-- Browser / UI Window Frame -->
  <g transform="translate(60, 50)">
    <!-- Window Drop Shadow -->
    <rect x="0" y="0" width="480" height="250" rx="10" fill="#000000" opacity="0.35" transform="translate(10, 10)"/>

    <!-- Window Body -->
    <rect x="0" y="0" width="480" height="250" rx="10" fill="#FFFFFF"/>
    
    <!-- Window Top Header Bar -->
    <path d="M 0 10 C 0 4.5, 4.5 0, 10 0 L 470 0 C 475.5 0, 480 4.5, 480 10 L 480 34 L 0 34 Z" fill="#F1F5F9"/>
    
    <!-- Window 3 Control Dots (Red, Yellow, Green) -->
    <circle cx="18" cy="17" r="5" fill="#EF4444"/>
    <circle cx="34" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="50" cy="17" r="5" fill="#10B981"/>

    <!-- Browser Address Bar -->
    <rect x="80" y="8" width="280" height="18" rx="9" fill="#E2E8F0"/>
    <circle cx="94" cy="17" r="3" fill="#94A3B8"/>
    <rect x="106" y="14" width="100" height="6" rx="3" fill="#94A3B8"/>

    <!-- Sidebar in UI -->
    <rect x="0" y="34" width="110" height="216" fill="#0B132B"/>
    <circle cx="28" cy="56" r="10" fill="#38BDF8"/>
    <rect x="46" y="52" width="45" height="8" rx="4" fill="#FFFFFF"/>
    
    <rect x="16" y="80" width="78" height="6" rx="3" fill="#475569"/>
    <rect x="16" y="98" width="60" height="6" rx="3" fill="#2563EB"/>
    <rect x="16" y="116" width="70" height="6" rx="3" fill="#475569"/>
    <rect x="16" y="134" width="55" height="6" rx="3" fill="#475569"/>

    <!-- Main Content Area -->
    <!-- Hero Banner Card -->
    <rect x="125" y="48" width="340" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="140" y="62" width="120" height="12" rx="4" fill="#0F172A"/>
    <rect x="140" y="82" width="180" height="8" rx="4" fill="#64748B"/>
    <rect x="140" y="96" width="150" height="8" rx="4" fill="#94A3B8"/>
    <rect x="380" y="60" width="70" height="56" rx="6" fill="#DBEAFE"/>

    <!-- 3 Cards in Grid -->
    <rect x="125" y="140" width="105" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="135" y="152" width="40" height="8" rx="4" fill="#2563EB"/>
    <rect x="135" y="168" width="85" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="135" y="180" width="65" height="6" rx="3" fill="#E2E8F0"/>

    <rect x="242" y="140" width="105" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="252" y="152" width="50" height="8" rx="4" fill="#2563EB"/>
    <rect x="252" y="168" width="85" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="252" y="180" width="65" height="6" rx="3" fill="#E2E8F0"/>

    <rect x="360" y="140" width="105" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="370" y="152" width="45" height="8" rx="4" fill="#2563EB"/>
    <rect x="370" y="168" width="85" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="370" y="180" width="65" height="6" rx="3" fill="#E2E8F0"/>
  </g>

  <!-- Tag overlay -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155"/>
  <text x="32" y="38" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">WEB APPLICATION</text>
</svg>
