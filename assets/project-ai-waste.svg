<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020B27"/>
      <stop offset="100%" stop-color="#091B52"/>
    </linearGradient>
    <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020B27" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#aiBg)"/>
  
  <!-- Glowing Center Backdrop -->
  <circle cx="300" cy="170" r="160" fill="url(#brainGlow)"/>

  <!-- Grid lines -->
  <g stroke="#1E40AF" stroke-width="0.8" opacity="0.3">
    <line x1="0" y1="85" x2="600" y2="85"/>
    <line x1="0" y1="170" x2="600" y2="170"/>
    <line x1="0" y1="255" x2="600" y2="255"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
  </g>

  <!-- Neural Network Nodes & Brain Silhouette -->
  <!-- Left Hemisphere -->
  <path d="M 290 80 C 230 80 180 110 180 170 C 180 230 230 260 290 260 C 295 240 295 100 290 80 Z" 
        stroke="#38BDF8" stroke-width="2" fill="#0369A1" fill-opacity="0.1"/>
  <!-- Right Hemisphere -->
  <path d="M 310 80 C 370 80 420 110 420 170 C 420 230 370 260 310 260 C 305 240 305 100 310 80 Z" 
        stroke="#38BDF8" stroke-width="2" fill="#0369A1" fill-opacity="0.1"/>

  <!-- Neural Connections -->
  <g stroke="#60A5FA" stroke-width="1.5" opacity="0.8">
    <!-- Center fissure bridges -->
    <line x1="285" y1="110" x2="315" y2="110"/>
    <line x1="280" y1="140" x2="320" y2="140"/>
    <line x1="280" y1="170" x2="320" y2="170"/>
    <line x1="280" y1="200" x2="320" y2="200"/>
    <line x1="285" y1="230" x2="315" y2="230"/>
    
    <!-- Left nodes lines -->
    <line x1="220" y1="130" x2="260" y2="110"/>
    <line x1="220" y1="130" x2="200" y2="180"/>
    <line x1="200" y1="180" x2="240" y2="170"/>
    <line x1="240" y1="170" x2="280" y2="140"/>
    <line x1="240" y1="170" x2="220" y2="220"/>
    <line x1="220" y1="220" x2="260" y2="230"/>
    <line x1="260" y1="110" x2="285" y2="110"/>

    <!-- Right nodes lines -->
    <line x1="380" y1="130" x2="340" y2="110"/>
    <line x1="380" y1="130" x2="400" y2="180"/>
    <line x1="400" y1="180" x2="360" y2="170"/>
    <line x1="360" y1="170" x2="320" y2="140"/>
    <line x1="360" y1="170" x2="380" y2="220"/>
    <line x1="380" y1="220" x2="340" y2="230"/>
    <line x1="340" y1="110" x2="315" y2="110"/>
  </g>

  <!-- Glowing Nodes / Dots -->
  <g fill="#38BDF8">
    <circle cx="220" cy="130" r="5"/>
    <circle cx="260" cy="110" r="4"/>
    <circle cx="200" cy="180" r="5"/>
    <circle cx="240" cy="170" r="6"/>
    <circle cx="220" cy="220" r="4"/>
    <circle cx="260" cy="230" r="5"/>
    <circle cx="280" cy="140" r="4"/>
    <circle cx="280" cy="200" r="4"/>

    <circle cx="380" cy="130" r="5"/>
    <circle cx="340" cy="110" r="4"/>
    <circle cx="400" cy="180" r="5"/>
    <circle cx="360" cy="170" r="6"/>
    <circle cx="380" cy="220" r="4"/>
    <circle cx="340" cy="230" r="5"/>
    <circle cx="320" cy="140" r="4"/>
    <circle cx="320" cy="200" r="4"/>
  </g>

  <!-- Circuit traces radiating outward -->
  <g stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M 180 170 L 120 170 L 90 140 L 40 140"/>
    <circle cx="40" cy="140" r="3" fill="#38BDF8"/>
    <path d="M 220 220 L 160 270 L 80 270"/>
    <circle cx="80" cy="270" r="3" fill="#38BDF8"/>
    <path d="M 420 170 L 480 170 L 510 140 L 560 140"/>
    <circle cx="560" cy="140" r="3" fill="#38BDF8"/>
    <path d="M 380 220 L 440 270 L 520 270"/>
    <circle cx="520" cy="270" r="3" fill="#38BDF8"/>
  </g>

  <!-- Tag overlay -->
  <rect x="20" y="20" width="140" height="28" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155"/>
  <text x="32" y="38" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">AI &amp; COMPUTER VISION</text>
</svg>
