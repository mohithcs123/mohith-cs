<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <!-- Glowing aura behind -->
  <defs>
    <filter id="glowAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bookBlue1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bookBlue2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Abstract Blue Background Ribbon Swoosh -->
  <path d="M 10 120 C 50 80, 150 140, 190 70 C 170 130, 80 150, 10 120 Z" fill="#93C5FD" opacity="0.4" />
  <path d="M 30 140 C 70 100, 160 130, 180 90 C 160 140, 90 150, 30 140 Z" fill="#3B82F6" opacity="0.3" />

  <!-- Stack of Books -->
  <!-- Bottom Book -->
  <rect x="40" y="126" width="120" height="14" rx="3" fill="#1E40AF" />
  <rect x="44" y="129" width="112" height="8" rx="1" fill="#F8FAFC" />
  <rect x="36" y="124" width="8" height="18" rx="2" fill="#1D4ED8" />

  <!-- Middle Book -->
  <rect x="46" y="110" width="110" height="14" rx="3" fill="#3B82F6" />
  <rect x="50" y="113" width="102" height="8" rx="1" fill="#FFFFFF" />
  <rect x="42" y="108" width="8" height="18" rx="2" fill="#2563EB" />

  <!-- Top Book -->
  <rect x="50" y="96" width="100" height="12" rx="3" fill="#60A5FA" />
  <rect x="54" y="99" width="92" height="6" rx="1" fill="#F8FAFC" />

  <!-- Graduation Cap (Mortarboard) -->
  <!-- Cap Skull Base -->
  <path d="M 72 65 C 72 65, 80 82, 100 82 C 120 82, 128 65, 128 65 L 72 65 Z" fill="#0F172A" />
  
  <!-- Diamond Cap Top -->
  <polygon points="100,32 165,54 100,72 35,54" fill="url(#capGrad)" stroke="#334155" stroke-width="1.5" />
  <polygon points="100,35 158,54 100,70 42,54" fill="#1E293B" opacity="0.6" />

  <!-- Cap Button on Top -->
  <ellipse cx="100" cy="53" rx="4" ry="2.5" fill="#38BDF8" />

  <!-- Tassel / String -->
  <path d="M 100 53 Q 130 54 138 68 Q 142 78 140 92" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Tassel Brush -->
  <polygon points="137,92 143,92 145,104 135,104" fill="#38BDF8" />
  <circle cx="140" cy="93" r="2.5" fill="#60A5FA" />
</svg>
